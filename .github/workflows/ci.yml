name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  data:
    name: Data integrity + version lockstep + reviews in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.x" }
      - name: Validate data files & version lockstep
        run: python3 scripts/validate_data.py
      - name: Review prose (rules 10, 13, 16, 26, 40, 41)
        run: |
          python3 scripts/check_review_placement.py
          python3 scripts/check_review_english.py
          python3 scripts/check_review_bullets.py
      - name: topic_reviews.json is in sync with topic_reviews_md/
        run: |
          python3 scripts/md_to_reviews.py
          git diff --exit-code -- public_html/topic_reviews.json \
            || (echo "::error::public_html/topic_reviews.json is stale. Run 'python3 scripts/md_to_reviews.py' and commit." && exit 1)

  javascript:
    name: JS syntax + lint (no-undef)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: "20" }
      - name: Syntax check
        run: |
          node --check public_html/app.js
          node --check public_html/sw.js
      - name: ESLint (no-undef)
        run: npx --yes eslint@8.57.0 --no-eslintrc --config .eslintrc.json public_html/app.js public_html/sw.js

  php:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2" }
      - name: php -l on every endpoint
        run: |
          status=0
          for f in public_html/*.php; do php -l "$f" || status=1; done
          exit $status

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run gitleaks on the working tree
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --redact --no-banner --config .gitleaks.toml --exit-code 1

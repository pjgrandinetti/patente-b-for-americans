<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-label="Una rotatoria a due corsie vista dall'alto, con il traffico in senso antiorario. Dall'ingresso in basso l'auto nella corsia di destra prende la prima uscita o prosegue dritto; l'auto nella corsia di sinistra percorre la corsia interna per l'uscita a sinistra e si sposta nella corsia di destra, con la freccia a destra, prima di uscire. Ogni uscita si prende dalla corsia esterna.">
<title>Una rotatoria a due corsie vista dall'alto, con il traffico in senso antiorario. Dall'ingresso in basso l'auto nella corsia di destra prende la prima uscita o prosegue dritto; l'auto nella corsia di sinistra percorre la corsia interna per l'uscita a sinistra e si sposta nella corsia di destra, con la freccia a destra, prima di uscire. Ogni uscita si prende dalla corsia esterna.</title>

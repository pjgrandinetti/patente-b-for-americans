<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130" role="img" aria-label="Green wave animation">
  <title>Green wave: a car at the advised speed meets each light on green; the light turns yellow then red behind it</title>

  <!-- self-contained light panel so it reads on light and dark review backgrounds -->
  <rect x="2" y="2" width="416" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- road -->
  <rect x="10" y="80" width="400" height="26" fill="#64748b"/>
  <line x1="14" y1="93" x2="406" y2="93" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="14 12"/>

  <!-- ── traffic lights: red, then green as the car arrives, then yellow, then red ── -->
  <!-- light 1: green 0.14-0.24, yellow 0.24-0.29 -->
  <g>
    <rect x="68" y="42" width="4" height="38" fill="#374151"/>
    <rect x="60" y="20" width="20" height="34" rx="4" fill="#1f2937"/>
    <circle cx="70" cy="29" r="4.6"><animate attributeName="fill" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.14;0.29;1" values="#ef4444;#7f1d1d;#ef4444;#ef4444"/></circle>
    <circle cx="70" cy="37" r="4.6"><animate attributeName="fill" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.24;0.29;1" values="#7c5410;#f59e0b;#7c5410;#7c5410"/></circle>
    <circle cx="70" cy="45" r="4.6"><animate attributeName="fill" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.14;0.24;1" values="#14532d;#22c55e;#14532d;#14532d"/></circle>
  </g>
  <!-- light 2: green 0.35-0.45, yellow 0.45-0.50 -->
  <g>
    <rect x="168" y="42" width="4" height="38" fill="#374151"/>
    <rect x="160" y="20" width="20" height="34" rx="4" fill="#1f2937"/>
    <circle cx="170" cy="29" r="4.6"><animate attributeName="fill" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.35;0.50;1" values="#ef4444;#7f1d1d;#ef4444;#ef4444"/></circle>
    <circle cx="170" cy="37" r="4.6"><animate attributeName="fill" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.45;0.50;1" values="#7c5410;#f59e0b;#7c5410;#7c5410"/></circle>
    <circle cx="170" cy="45" r="4.6"><animate attributeName="fill" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.35;0.45;1" values="#14532d;#22c55e;#14532d;#14532d"/></circle>
  </g>
  <!-- light 3: green 0.55-0.65, yellow 0.65-0.70 -->
  <g>
    <rect x="268" y="42" width="4" height="38" fill="#374151"/>
    <rect x="260" y="20" width="20" height="34" rx="4" fill="#1f2937"/>
    <circle cx="270" cy="29" r="4.6"><animate attributeName="fill" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.55;0.70;1" values="#ef4444;#7f1d1d;#ef4444;#ef4444"/></circle>
    <circle cx="270" cy="37" r="4.6"><animate attributeName="fill" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.65;0.70;1" values="#7c5410;#f59e0b;#7c5410;#7c5410"/></circle>
    <circle cx="270" cy="45" r="4.6"><animate attributeName="fill" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.55;0.65;1" values="#14532d;#22c55e;#14532d;#14532d"/></circle>
  </g>
  <!-- light 4: green 0.76-0.86, yellow 0.86-0.91 -->
  <g>
    <rect x="368" y="42" width="4" height="38" fill="#374151"/>
    <rect x="360" y="20" width="20" height="34" rx="4" fill="#1f2937"/>
    <circle cx="370" cy="29" r="4.6"><animate attributeName="fill" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.76;0.91;1" values="#ef4444;#7f1d1d;#ef4444;#ef4444"/></circle>
    <circle cx="370" cy="37" r="4.6"><animate attributeName="fill" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.86;0.91;1" values="#7c5410;#f59e0b;#7c5410;#7c5410"/></circle>
    <circle cx="370" cy="45" r="4.6"><animate attributeName="fill" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.76;0.86;1" values="#14532d;#22c55e;#14532d;#14532d"/></circle>
  </g>

  <!-- ── the car, moving left to right at a constant speed ── -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-60 0" to="430 0" dur="8s" repeatCount="indefinite" calcMode="linear"/>
    <circle cx="22" cy="62" r="12" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <text x="22" y="66.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111827">50</text>
    <circle cx="11" cy="101" r="5" fill="#111827"/><circle cx="11" cy="101" r="2" fill="#9ca3af"/>
    <circle cx="33" cy="101" r="5" fill="#111827"/><circle cx="33" cy="101" r="2" fill="#9ca3af"/>
    <rect x="0" y="85" width="44" height="13" rx="4" fill="#2563eb"/>
    <rect x="9" y="76" width="26" height="11" rx="4" fill="#3b82f6"/>
    <rect x="12" y="78" width="20" height="7" rx="2" fill="#bfdbfe"/>
  </g>
</svg>

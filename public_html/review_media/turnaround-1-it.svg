<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-label="Inversione di marcia, prima manovra, vista dall'alto su una strada a doppio senso. L'auto parte dal margine destro con la freccia a sinistra, avanza sterzando a sinistra e si ferma di traverso con il muso poco prima del margine sinistro.">

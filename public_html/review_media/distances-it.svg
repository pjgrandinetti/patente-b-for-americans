<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 724" role="img" aria-label="Distanze in metri: i multipli di 50 m che i pannelli del passaggio a livello contano a ritroso, la distanza di sicurezza a ogni velocità, e le distanze brevi di sosta e fermata.">
<title>Distanze in metri: i multipli di 50 m che i pannelli del passaggio a livello contano a ritroso, la distanza di sicurezza a ogni velocità, e le distanze brevi di sosta e fermata.</title>
<rect x="1" y="1" width="638" height="722" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="16" y="34" font-size="14" font-weight="700" fill="#1e293b">Multipli di 50 m: una barra rossa ogni 50 m</text>
<rect x="16" y="48" width="196" height="250" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<rect x="28" y="58" width="22" height="46" rx="2" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><path d="M31 75 L47 66 L47 71 L31 80 Z" fill="#dc2626"/><path d="M31 87 L47 78 L47 83 L31 92 Z" fill="#dc2626"/><path d="M31 99 L47 90 L47 95 L31 104 Z" fill="#dc2626"/>
<text x="62" y="90" font-size="24" font-weight="700" fill="#712B13">150 m</text>
<text x="28" y="124" font-size="12" fill="#712B13">Segnale di pericolo,</text>
<text x="28" y="139" font-size="12" fill="#712B13">fuori dai centri abitati</text>
<text x="28" y="162" font-size="12" fill="#712B13">Passaggio a livello:</text>
<text x="28" y="177" font-size="12" fill="#712B13">pannello a tre barre</text>
<rect x="222" y="48" width="196" height="250" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<rect x="234" y="58" width="22" height="46" rx="2" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><path d="M237 75 L253 66 L253 71 L237 80 Z" fill="#dc2626"/><path d="M237 87 L253 78 L253 83 L237 92 Z" fill="#dc2626"/>
<text x="268" y="90" font-size="24" font-weight="700" fill="#712B13">100 m</text>
<text x="234" y="124" font-size="12" fill="#712B13">Passaggio a livello:</text>
<text x="234" y="139" font-size="12" fill="#712B13">pannello a due barre</text>
<text x="234" y="162" font-size="12" fill="#712B13">Triangolo:</text>
<text x="234" y="177" font-size="12" fill="#712B13">visibile da</text>
<text x="234" y="200" font-size="12" fill="#712B13">Autocarri oltre 3,5 t</text>
<text x="234" y="215" font-size="12" fill="#712B13">senza sorpasso:</text>
<text x="234" y="230" font-size="12" fill="#712B13">distanza tra loro</text>
<text x="234" y="253" font-size="12" fill="#712B13">Nebbia: visibilità sotto</text>
<text x="234" y="268" font-size="12" fill="#712B13">cui si può imporre</text>
<text x="234" y="283" font-size="12" fill="#712B13">un limite</text>
<rect x="428" y="48" width="196" height="250" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<rect x="440" y="58" width="22" height="46" rx="2" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><path d="M443 75 L459 66 L459 71 L443 80 Z" fill="#dc2626"/>
<text x="474" y="90" font-size="24" font-weight="700" fill="#712B13">50 m</text>
<text x="440" y="124" font-size="12" fill="#712B13">Passaggio a livello:</text>
<text x="440" y="139" font-size="12" fill="#712B13">pannello a una barra</text>
<text x="440" y="162" font-size="12" fill="#712B13">Triangolo:</text>
<text x="440" y="177" font-size="12" fill="#712B13">dietro il veicolo</text>
<text x="440" y="200" font-size="12" fill="#712B13">Nebbia: visibilità</text>
<text x="440" y="215" font-size="12" fill="#712B13">sotto cui si accende</text>
<text x="440" y="230" font-size="12" fill="#712B13">il retronebbia</text>
<text x="16" y="324" font-size="14" font-weight="700" fill="#1e293b">Distanza di sicurezza, circa (velocità ÷ 10) × 3</text>
<text x="16" y="353" font-size="12" fill="#475569">30 km/h</text>
<rect x="84" y="340" width="99" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="191" y="354" font-size="13" font-weight="700" fill="#085041">9 m</text>
<text x="16" y="379" font-size="12" fill="#475569">50 km/h</text>
<rect x="84" y="366" width="154" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="246" y="380" font-size="13" font-weight="700" fill="#085041">14 m</text>
<text x="16" y="405" font-size="12" fill="#475569">100 km/h</text>
<rect x="84" y="392" width="308" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="400" y="406" font-size="13" font-weight="700" fill="#085041">28 m</text>
<text x="16" y="431" font-size="12" fill="#475569">130 km/h</text>
<rect x="84" y="418" width="396" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="488" y="432" font-size="13" font-weight="700" fill="#085041">36 m</text>
<text x="16" y="457" font-size="12" fill="#475569">150 km/h</text>
<rect x="84" y="444" width="462" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="554" y="458" font-size="13" font-weight="700" fill="#085041">42 m</text>
<text x="16" y="490" font-size="14" font-weight="700" fill="#1e293b">Da vicino, e due eccezioni</text>
<rect x="16" y="502" width="54" height="22" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="43" y="517" text-anchor="middle" font-size="12" font-weight="700" fill="#3C3489">1 m</text>
<text x="78" y="517" font-size="12.5" fill="#1e293b">Pedoni, senza marciapiede rialzato</text>
<rect x="16" y="532" width="54" height="22" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="43" y="547" text-anchor="middle" font-size="12" font-weight="700" fill="#3C3489">1 m</text>
<text x="78" y="547" font-size="12.5" fill="#1e293b">Triangolo, dal bordo della strada</text>
<rect x="16" y="562" width="54" height="22" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="43" y="577" text-anchor="middle" font-size="12" font-weight="700" fill="#3C3489">3 m</text>
<text x="78" y="577" font-size="12.5" fill="#1e293b">Liberi per la sosta a sinistra nel senso unico</text>
<rect x="16" y="592" width="54" height="22" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="43" y="607" text-anchor="middle" font-size="12" font-weight="700" fill="#3C3489">5 m</text>
<text x="78" y="607" font-size="12.5" fill="#1e293b">Niente fermata vicino a un incrocio, in città</text>
<rect x="16" y="622" width="54" height="22" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="43" y="637" text-anchor="middle" font-size="12" font-weight="700" fill="#3C3489">15 m</text>
<text x="78" y="637" font-size="12.5" fill="#1e293b">Niente sosta dal segnale di fermata bus</text>
<rect x="16" y="652" width="54" height="22" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="43" y="667" text-anchor="middle" font-size="12" font-weight="700" fill="#3C3489">20 m</text>
<text x="78" y="667" font-size="12.5" fill="#1e293b">Dietro uno sgombraneve in azione</text>
<rect x="16" y="682" width="54" height="22" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="43" y="697" text-anchor="middle" font-size="12" font-weight="700" fill="#3C3489">500 m</text>
<text x="78" y="697" font-size="12.5" fill="#1e293b">Corsia di emergenza per raggiungere un'uscita</text>
</g></svg>

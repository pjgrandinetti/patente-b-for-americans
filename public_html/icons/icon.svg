<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Muted Italian tricolor background (full bleed) -->
  <rect x="0"   y="0" width="170.67" height="512" fill="#5e9b78"/>
  <rect x="170.67" y="0" width="170.66" height="512" fill="#f4efe5"/>
  <rect x="341.33" y="0" width="170.67" height="512" fill="#c66f64"/>

  <!-- Soft circular backing so the wheel reads cleanly over the busy bands -->
  <circle cx="256" cy="256" r="178" fill="#2f2a35" opacity="0.10"/>

  <!-- Steering wheel -->
  <g stroke="#36313c" fill="none" stroke-linecap="round">
    <!-- rim -->
    <circle cx="256" cy="256" r="150" stroke-width="30"/>
    <!-- subtle rim highlight -->
    <circle cx="256" cy="256" r="150" stroke="#ffffff" stroke-width="5" opacity="0.10"/>
    <!-- spokes: left, right, and down -->
    <line x1="132" y1="256" x2="380" y2="256" stroke-width="26"/>
    <line x1="256" y1="256" x2="256" y2="388" stroke-width="26"/>
  </g>
  <!-- hub -->
  <circle cx="256" cy="256" r="46" fill="#36313c"/>
  <circle cx="256" cy="256" r="46" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.10"/>
</svg>

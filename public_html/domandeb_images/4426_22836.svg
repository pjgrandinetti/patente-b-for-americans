<?xml version="1.0" encoding="UTF-8"?>
<!-- Redrawn for the app (CC BY-SA 4.0): two-way road, two lanes per direction,
     with a bicycle lane along each edge. Replaces the Ministry's 140x163 scan. -->
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="320" viewBox="0 0 260 320">
  <rect width="260" height="320" fill="#ffffff"/>
  <rect x="10" y="10" width="240" height="300" fill="#8f8c86"/>
  <!-- bicycle lanes: slightly lighter strip -->
  <rect x="10" y="10" width="34" height="300" fill="#9a9791"/>
  <rect x="216" y="10" width="34" height="300" fill="#9a9791"/>
  <!-- yellow lane-boundary lines -->
  <rect x="42" y="10" width="4" height="300" fill="#e6d21c"/>
  <rect x="214" y="10" width="4" height="300" fill="#e6d21c"/>
  <!-- solid white center line -->
  <rect x="128" y="10" width="4" height="300" fill="#f4f4f4"/>
  <!-- dashed white lane lines -->
  <g stroke="#f4f4f4" stroke-width="3" stroke-dasharray="22 16">
    <line x1="88" y1="10" x2="88" y2="310"/>
    <line x1="172" y1="10" x2="172" y2="310"/>
  </g>
  <!-- bicycle symbols, one per lane, facing its direction of travel -->
  <g id="bike" fill="none" stroke="#f4f4f4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-9" cy="6" r="6"/>
    <circle cx="9" cy="6" r="6"/>
    <path d="M-9 6 L-3 -5 L6 -5 L9 6 M-3 -5 L2 6 L-9 6 M6 -5 L4 -9 L8 -9"/>
  </g>
  <use href="#bike" transform="translate(27 245) rotate(90) scale(1.5)"/>
  <use href="#bike" transform="translate(233 75) rotate(-90) scale(1.5)"/>
</svg>
